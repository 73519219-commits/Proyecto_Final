<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container py-2">
    <a class="navbar-brand d-flex align-items-center gap-2" [routerLink]="['/']">
      <span class="brand-icon">🍲</span>
      <span class="fw-bold text-success-custom">Alimento Solidario Huancayo</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">
        <li class="nav-item" *ngFor="let item of itemsMenu()">
          <a class="nav-link" [routerLink]="[item.ruta]" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.ruta === '/' }">
            {{ item.label }}
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2" *ngIf="usuarioActual(); else sinSesion">
        <span class="badge rounded-pill text-bg-light fw-normal">
          {{ usuarioActual()?.nombre }}
        </span>
        <button class="btn btn-outline-success" type="button" (click)="cerrarSesion()">Salir</button>
      </div>

      <ng-template #sinSesion>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-success" routerLink="/login">Iniciar sesión</a>
          <a class="btn btn-primary text-white" routerLink="/registro">Registrarse</a>
        </div>
      </ng-template>
    </div>
  </div>
</nav>
