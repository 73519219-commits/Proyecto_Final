<div class="card h-100 border-0 shadow-sm">

      <span class="icon-badge bg-{{ color }}-subtle text-{{ color }}-emphasis">{{ icono }}</span>
      <span class="badge text-bg-light">{{ titulo }}</span>

    <h3 class="fw-bold mb-1">{{ valor }}</h3>

  </div>
</div>
