<section class="page-section">
  <div class="container-fluid">
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body p-4">
            <h3 class="fw-bold mb-3">Gestionar usuarios</h3>
            <div class="alert alert-success" *ngIf="mensaje()">{{ mensaje() }}</div>

            <form [formGroup]="usuarioForm" (ngSubmit)="guardarUsuario()" novalidate>
              <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input class="form-control" formControlName="nombre" />
              </div>
              <div class="mb-3">
                <label class="form-label">Correo</label>
                <input class="form-control" type="email" formControlName="email" />
              </div>
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input class="form-control" type="password" formControlName="password" />
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Tipo</label>
                  <select class="form-select" formControlName="tipo">
                    <option value="Administrador">Administrador</option>
                    <option value="Negocio">Negocio</option>
                    <option value="Comedor popular">Comedor popular</option>
                    <option value="Voluntario">Voluntario</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Estado</label>
                  <select class="form-select" formControlName="estado">
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                  </select>
                </div>
              </div>
              <div class="mb-3 mt-3">
                <label class="form-label">Teléfono</label>
                <input class="form-control" formControlName="telefono" />
              </div>
              <div class="mb-3">
                <label class="form-label">Dirección</label>
                <input class="form-control" formControlName="direccion" />
              </div>
              <div class="mb-3">
                <label class="form-label">Organización</label>
                <input class="form-control" formControlName="empresa" />
              </div>

              <div class="d-flex gap-2 justify-content-end">
                <button class="btn btn-outline-secondary" type="button" (click)="resetFormulario()">Cancelar</button>
                <button class="btn btn-primary text-white" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="fw-bold mb-3">Lista de usuarios</h3>
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Estado</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let usuario of usuarios()">
                    <td>
                      <strong>{{ usuario.nombre }}</strong><br>
                      <small class="text-secondary">{{ usuario.email }}</small>
                    </td>
                    <td>{{ usuario.tipo }}</td>
                    <td>
                      <span class="badge rounded-pill bg-success-subtle text-success-emphasis" *ngIf="usuario.estado === 'Activo'">Activo</span>
                      <span class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis" *ngIf="usuario.estado === 'Inactivo'">Inactivo</span>
                    </td>
                    <td>
                      <div class="btn-group btn-group-sm" role="group">
                        <button class="btn btn-outline-primary" type="button" (click)="editarUsuario(usuario)">Editar</button>
                        <button class="btn btn-outline-danger" type="button" (click)="eliminarUsuario(usuario.id)">Eliminar</button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
