<section class="page-section">
  <div class="container-fluid">
    <div class="alert alert-info" *ngIf="mensaje()">
      {{ mensaje() }}
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="fw-bold mb-3">Donaciones disponibles</h3>
            <div class="list-group">
              <div class="list-group-item" *ngFor="let item of donaciones()">
                <div class="d-flex justify-content-between align-items-start gap-3">
                  <div>
                    <h6 class="fw-bold mb-1">{{ item.nombreAlimento }}</h6>
                    <p class="mb-1 text-secondary">{{ item.descripcion }}</p>
                    <small class="text-muted">{{ item.cantidad }} {{ item.unidadMedida }} · {{ item.direccionRecogida }}</small>
                  </div>
                  <button class="btn btn-primary btn-sm text-white" type="button" (click)="solicitarDonacion(item)">Solicitar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="fw-bold mb-3">Mis solicitudes</h3>
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Alimento</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let item of solicitudes()">
                    <td>{{ item.comedorNombre }}</td>
                    <td>{{ item.fechaSolicitud }}</td>
                    <td>
                      <span class="badge rounded-pill bg-warning-subtle text-warning-emphasis" *ngIf="item.estado === 'Pendiente'">Pendiente</span>
                      <span class="badge rounded-pill bg-success-subtle text-success-emphasis" *ngIf="item.estado === 'Aprobada'">Aprobada</span>
                      <span class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis" *ngIf="item.estado === 'Cancelada'">Cancelada</span>
                    </td>
                    <td>
                      <button class="btn btn-outline-danger btn-sm" type="button" (click)="cancelarSolicitud(item.id)" *ngIf="item.estado !== 'Cancelada'">Cancelar</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
